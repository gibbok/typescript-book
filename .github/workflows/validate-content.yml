name: validate-content
run-name: ${{ github.actor }} validate content

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read

concurrency:
  group: validate-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-compile-content:
    if: github.event.pull_request.draft == false || github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run lint script
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/lint.sh
      - name: Run compile script
        run: bash ${GITHUB_WORKSPACE}/.github/workflows/compile.sh
  verify-typescript-news:
    if: github.event.pull_request.draft == false || github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify TypeScript news order and locale parity
        run: python3 .agents/skills/create-typescript-news/scripts/verify_news_order.py
  test-github-actions:
    if: github.event.pull_request.draft == false || github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Test GitHub Actions scripts
        run: node --test tools/github-actions/*.test.js
