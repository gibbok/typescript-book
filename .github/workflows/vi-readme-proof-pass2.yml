name: Vietnamese README proof pass 2

on:
  push:
    branches: [agent/vietnamese-translation]
    paths: ['.github/workflows/vi-readme-proof-pass2.yml']

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply low-risk copy fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('README-vi_VN.md')
          s=p.read_text(encoding='utf-8')
          fixes={
            'bạn có thể dùng từ khóa `new` theo sau bởi tên class, rồi dấu ngoặc đơn `()`.':'bạn có thể dùng từ khóa `new`, theo sau là tên class rồi dấu ngoặc đơn `()`.',
            'Abstract Class được sử dụng trong TypeScript chủ yếu cho kế thừa. Chúng cung cấp cách định nghĩa các thuộc tính và phương thức chung có thể được các subclass kế thừa.':'Abstract Class được sử dụng trong TypeScript chủ yếu cho kế thừa. Nó cung cấp cách định nghĩa các thuộc tính và phương thức chung có thể được các subclass kế thừa.',
            'Lưu ý: Decorator của phiên bản 5 không cho phép decorate tham số.':'Lưu ý: Decorator của phiên bản 5 không cho phép trang trí tham số.',
            'Tạo một kiểu đệ quy unwrap các kiểu Promise.':'Tạo một kiểu gỡ bọc đệ quy các kiểu Promise.',
            'Chuyển tên của input type T thành chữ hoa.':'Chuyển tên của kiểu đầu vào T thành chữ hoa.',
            'Chuyển tên của input type T thành chữ thường.':'Chuyển tên của kiểu đầu vào T thành chữ thường.',
            'Viết hoa chữ cái đầu tên của input type T.':'Viết hoa chữ cái đầu trong tên của kiểu đầu vào T.',
            'Chuyển chữ cái đầu tên của input type T thành chữ thường.':'Chuyển chữ cái đầu trong tên của kiểu đầu vào T thành chữ thường.',
          }
          for old,new in fixes.items():
            if old not in s:
              raise SystemExit(f'Missing expected text: {old}')
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          def fences(x): return re.findall(r'```[^\n]*\n.*?```',x,re.S)
          if fences(Path('README.md').read_text(encoding='utf-8')) != fences(s):
            raise SystemExit('Code fences changed')
          print(f'Applied {len(fixes)} low-risk copy fixes; code fences unchanged.')
          PY
      - name: Validate Markdown
        run: cd tools && npm ci && npm run lint:md
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/vi-readme-proof-pass2.yml
          git add README-vi_VN.md .github/workflows/vi-readme-proof-pass2.yml
          git commit -m "Refine Vietnamese README copy" || exit 0
          git push
