title: TypeScript 7 cải thiện mức sử dụng bộ nhớ của Go to Implementation
description: Một bản sửa trong language service native ngăn tăng trưởng bộ nhớ bậc hai khi tìm implementation trong các project lớn có kiểu phức tạp sâu.
lastUpdated: 2026-07-30
sidebar:
    order: 3
head:
    - tag: meta
      attrs:
          property: article:published_time
          content: '2026-07-30'
---

**Đã xuất bản:** July 30, 2026

Microsoft đã merge một bản sửa về khả năng mở rộng bộ nhớ cho Go to Implementation trong language service native của TypeScript.

## Nội dung thay đổi

Language service dùng một worklist duyệt theo chiều rộng để tìm implementation. Với một member của interface có nhiều implementation, các lượt tìm kiếm lặp lại trên toàn program có thể trả về cùng các reference nhiều lần. Các reference được giữ lại, công việc trong hàng đợi và nhóm kết quả vì thế có thể tăng theo bậc hai và làm cạn bộ nhớ trong các project lớn có kiểu phức tạp sâu.

Bản sửa loại bỏ trùng lặp các node reference trước khi thêm chúng vào hàng đợi công việc và tránh giữ lại các định nghĩa symbol trùng lặp. Một regression test kiểm tra rằng khi số lượng implementation tăng gấp đôi, mức tăng trưởng xấp xỉ tuyến tính thay vì bậc hai.

## Vì sao điều này quan trọng

Go to Implementation hiện có thể xử lý mẫu này mà không giữ đi giữ lại cùng các reference nội bộ. Phản hồi cuối cùng của editor vốn đã được loại bỏ trùng lặp, nên thay đổi này nhắm vào phần bộ nhớ và công việc ẩn cần thiết để tạo ra phản hồi đó.

## Tình trạng khả dụng

Thay đổi này đã được merge vào codebase TypeScript native sau bản phát hành TypeScript 7.0. Nguồn không chỉ rõ phiên bản npm ổn định nào chứa bản sửa này, vì vậy người dùng nên kiểm tra release notes của phiên bản đã cài đặt trước khi dựa vào nó.

## Nguồn

Đọc thay đổi chính thức: [Fix O(K^2) OOM issue in go-to-implementation](https://github.com/microsoft/typescript-go/commit/0f29c771a2f417de99888084cdefcf60f63a5fe0).
""",
          "website/src/content/docs/vi-vn/typescript-news/2026/typescript-7-native-api-adds-emit-methods.md": """---
title: API native của TypeScript 7 thêm các phương thức emit
description: API TypeScript native thêm các phương thức emit ra hệ thống file và trong bộ nhớ cho toàn bộ program và các output JavaScript hoặc declaration được chọn.
lastUpdated: 2026-07-24
sidebar:
    order: 6
head:
    - tag: meta
      attrs:
          property: article:published_time
          content: '2026-07-24'
---

**Đã xuất bản:** July 24, 2026

Codebase TypeScript native đã thêm các API emit theo chương trình cho những công cụ cần tạo output JavaScript hoặc declaration.

## Nội dung thay đổi

API đã merge cung cấp bốn đường emit với hành vi output và lựa chọn khác nhau.

* `program.emit(emitOnly?: EmitOnly)` emit toàn bộ program ra hệ thống file, bao gồm hệ thống file ảo đã cấu hình, và tôn trọng các tùy chọn chặn emit như `noEmit` và `noEmitOnError`.
* `program.emitToString(emitOnly?: EmitOnly)` emit toàn bộ program thành kết quả string trong bộ nhớ và cũng tôn trọng các tùy chọn chặn emit.
* `program.getJavaScriptEmit(files?: readonly DocumentIdentifier[])` trả về output JavaScript trong bộ nhớ cho các file được chọn và bỏ qua các tùy chọn chặn emit.
* `program.getDeclarationEmit(files?: readonly DocumentIdentifier[])` cung cấp output declaration tương ứng cho các file được chọn.

Điều này cho phép người dùng API có các lựa chọn riêng cho emit toàn bộ program thông thường và output trong bộ nhớ có mục tiêu.

## Tình trạng khả dụng

Thay đổi này đã được merge vào codebase TypeScript native vào ngày July 24, 2026. Nguồn không chỉ rõ phiên bản npm ổn định nào chứa các API này, vì vậy các công cụ nên xác minh hỗ trợ trong phiên bản TypeScript mà chúng sử dụng.

## Nguồn

Đọc pull request chính thức: [API emit](https://github.com/microsoft/typescript-go/pull/4699).
""",
