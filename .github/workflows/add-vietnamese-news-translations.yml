title: TypeScript 7.0 release candidate được công bố
description: TypeScript 7.0 release candidate giới thiệu trước compiler native, build song song, các thay đổi tương thích và hỗ trợ editor mở rộng.
lastUpdated: 2026-06-18
sidebar:
    order: 8
head:
    - tag: meta
      attrs:
          property: article:published_time
          content: '2026-06-18'
---

**Đã xuất bản:** June 18, 2026

Microsoft đã phát hành TypeScript 7.0 release candidate như bản preview cuối cùng trước bản phát hành TypeScript 7 ổn định.

## Nội dung thay đổi

Release candidate chuyển TypeScript sang compiler và language service mới dựa trên Go. Logic kiểm tra kiểu của nó được port từ TypeScript 6 để giữ nguyên semantics hiện có, đồng thời cải thiện hiệu năng thông qua native code và shared-memory parallelism.

TypeScript 7 thêm kiểm tra kiểu song song và build project-reference. Tùy chọn `--checkers` kiểm soát số worker kiểm tra kiểu, trong khi `--builders` kiểm soát số builder cho project-reference.

Tại thời điểm thông báo, release candidate có thể được cài đặt từ npm:

```shell
npm install --save-dev typescript@rc
```

## Tương thích

Release candidate không bao gồm API lập trình ổn định. Đội ngũ TypeScript cung cấp package tương thích `@typescript/typescript6` để các công cụ cần API TypeScript 6 có thể chạy cùng compiler mới.

Release candidate cũng áp dụng các mặc định của TypeScript 6 và xem các tùy chọn đã deprecated trong TypeScript 6 là lỗi. Các nhóm được khuyến nghị di chuyển sang TypeScript 6 trước khi đánh giá TypeScript 7.

## Nguồn

Đọc thông báo chính thức: [Announcing TypeScript 7.0 RC](https://devblogs.microsoft.com/typescript/announcing-typescript-7-0-rc/).
""",
          "website/src/content/docs/vi-vn/typescript-news/2026/typescript-7-released.md": """---
title: TypeScript 7.0 hiện đã khả dụng
description: TypeScript 7.0 giới thiệu compiler và language service native dựa trên Go, mang lại cải thiện hiệu năng lớn cho build và editor.
lastUpdated: 2026-07-08
sidebar:
    order: 7
head:
    - tag: meta
      attrs:
          property: article:published_time
          content: '2026-07-08'
---

**Đã xuất bản:** July 8, 2026

Microsoft đã phát hành TypeScript 7.0, phiên bản ổn định đầu tiên được xây dựng trên codebase Go native mới của project.

## Nội dung thay đổi

TypeScript 7 dùng native code, đa luồng bộ nhớ chia sẻ và các tối ưu hóa bổ sung. Theo đội ngũ TypeScript, full build trong các benchmark đã công bố nhanh hơn TypeScript 6 từ 7,7 đến 11,9 lần.

Bản phát hành này cũng chuyển language service sang Language Server Protocol. Các editor được hỗ trợ có thể dùng cùng nền tảng native để tải project, diagnostics, completions và navigation nhanh hơn.

Cài đặt bản phát hành ổn định từ npm:

```shell
npm install --save-dev typescript
```

## Tương thích

TypeScript 7.0 không cung cấp API lập trình ổn định. Các công cụ embed TypeScript, bao gồm Astro, Vue, MDX, Svelte hiện tại và một số workflow Angular, có thể vẫn cần TypeScript 6 cho đến khi API mới khả dụng.

Đội ngũ TypeScript dự kiến giới thiệu API mới trong TypeScript 7.1. Các project nên kiểm tra hỗ trợ của framework và tooling trước khi nâng cấp.

## Nguồn

Đọc thông báo chính thức: [Announcing TypeScript 7.0](https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/).
""",
          "website/src/content/docs/vi-vn/typescript-news/2026/typescript-7-workspace-symbol-search-scope.md": """---
title: TypeScript 7 thêm phạm vi tìm kiếm workspace-symbol
description: Language service native thêm một thiết lập có thể giới hạn tìm kiếm workspace-symbol trong project hiện tại.
lastUpdated: 2026-08-07
sidebar:
    order: 2
head:
    - tag: meta
      attrs:
          property: article:published_time
          content: '2026-08-07'
---

**Đã xuất bản:** August 7, 2026

Microsoft đã merge một phạm vi tìm kiếm workspace-symbol cho language service native của TypeScript.

## Nội dung thay đổi

Preference `workspaceSymbols.scope` mới có hai giá trị. `allOpenProjects` là mặc định và tìm kiếm symbol trên mọi project đang mở. `currentProject` giới hạn tìm kiếm trong các project chứa document được cung cấp.

Extension VS Code native hiện thêm một document TypeScript hoặc JavaScript được hỗ trợ vào các request `workspace/symbol`. Nó ưu tiên document đang active và nếu không thì dùng một document được hỗ trợ đang mở. Language service chỉ dùng document đó khi `workspaceSymbols.scope` là `currentProject`; nếu không, nó giữ tìm kiếm trên mọi project đang mở.

## Vì sao điều này quan trọng

Trong một workspace chứa nhiều project có các symbol được đặt tên tương tự, `currentProject` có thể giới hạn tập kết quả vào project liên quan. Mặc định giữ nguyên hành vi hiện có, nên thay đổi này là opt-in.

## Tình trạng khả dụng

