name: Vietnamese README final proof

on:
  push:
    branches:
      - agent/vietnamese-translation
    paths:
      - '.github/workflows/vi-readme-final-proof.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Apply final Vietnamese README copy fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README-vi_VN.md')
          text = path.read_text(encoding='utf-8')
          before = '[Vietnamese](https://github.com/gibbok/typescript-book/blob/main/README-vi_VN.md)'
          after = '[Tiếng Việt](https://github.com/gibbok/typescript-book/blob/main/README-vi_VN.md)'
          if before not in text:
              raise SystemExit('Expected untranslated Vietnamese link label was not found')
          text = text.replace(before, after, 1)
          if before in text:
              raise SystemExit('Unexpected duplicate untranslated Vietnamese link label remains')
          required = [
              'README-bg_BG.md',
              'README-de_DE.md',
              'README-fr_FR.md',
              'README-id_ID.md',
              'README-it_IT.md',
              'README-ja_JP.md',
              'README-ko_KR.md',
              'README-pl_PL.md',
              'README-pt_BR.md',
              'README-sv_SE.md',
              'README-tr_TR.md',
              'README-vi_VN.md',
              'README-zh_CN.md',
              'README_es_ES.md',
          ]
          for item in required:
              if item not in text:
                  raise SystemExit(f'Missing translation link target: {item}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Markdown
        run: |
          cd tools
          npm ci
          npm run lint:md

      - name: Commit and push
        run: |
          rm .github/workflows/vi-readme-final-proof.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README-vi_VN.md .github/workflows/vi-readme-final-proof.yml
          git commit -m 'Polish Vietnamese README translation links'
          git push
