name: Temporary TypeScript News Validation
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'website/**'
      - '.github/workflows/temporary-typescript-news-validation-2026-10-23.yml'
permissions:
  contents: read
jobs:
  validate-news-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Verify news inventory and locale parity
        run: python3 .agents/skills/create-typescript-news/scripts/verify_news.py
      - name: Run news verifier unit tests
        run: python3 -m unittest discover -s .agents/skills/create-typescript-news/scripts -p 'test_*.py'
      - name: Test news ordering and locale lists
        run: npm --prefix website run test:news
      - name: Install website dependencies
        working-directory: website
        run: npm ci
      - name: Build production website
        working-directory: website
        run: npm run build
      - name: Inspect all generated localized news pages
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const config = readFileSync('website/src/config/locales.ts', 'utf8');
          const locales = [...config.matchAll(/^\s*(root|'[a-z]{2}(?:-[a-z]{2})?'):\s*\{/gm)].map(x => x[1].replaceAll("'", ''));
          if (locales.length !== 19) throw new Error('Unexpected configured locale count: ' + locales.length);
          const slug = 'typescript-news/2026/typescript-7-1-beta/index.html';
          for (const locale of locales) {
            const file = join('website/dist', locale === 'root' ? '' : locale, slug);
            if (!existsSync(file)) throw new Error('Missing generated route: ' + file);
            const html = readFileSync(file, 'utf8');
            if (!html.includes('2026-10-20') || !html.includes('typescript-7-1-beta')) throw new Error('Missing date or slug: ' + file);
            if (locale === 'ar' && !/dir=["']rtl["']/.test(html)) throw new Error('Missing RTL direction: ' + file);
            console.log('Verified', locale, file);
          }
          const sitemapFiles = readdirSync('website/dist').filter(name => /^sitemap.*\.xml$/.test(name));
          if (!sitemapFiles.length) throw new Error('Missing sitemap XML');
          const sitemap = sitemapFiles.map(name => readFileSync(join('website/dist', name), 'utf8')).join('\n');
          if (!sitemap.includes('typescript-7-1-beta')) throw new Error('Article missing from sitemap');
          console.log('All localized routes and sitemap verified:', locales.length);
          NODE
      - name: Upload generated article pages and sitemap
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typescript-news-2026-10-23-generated-pages
          path: |
            website/dist/**/typescript-7-1-beta/index.html
            website/dist/sitemap*.xml
          if-no-files-found: warn
          retention-days: 2
