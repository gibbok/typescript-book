name: Localize Vietnamese README translation labels

on:
  push:
    branches:
      - agent/vietnamese-translation
    paths:
      - '.github/workflows/vi-readme-localize-translation-labels.yml'

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Localize language labels in Vietnamese README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README-vi_VN.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '[Bulgarian](https://github.com/gibbok/typescript-book/blob/main/README-bg_BG.md)': '[Tiếng Bulgaria](https://github.com/gibbok/typescript-book/blob/main/README-bg_BG.md)',
              '[German](https://github.com/gibbok/typescript-book/blob/main/README-de_DE.md)': '[Tiếng Đức](https://github.com/gibbok/typescript-book/blob/main/README-de_DE.md)',
              '[French](https://github.com/gibbok/typescript-book/blob/main/README-fr_FR.md)': '[Tiếng Pháp](https://github.com/gibbok/typescript-book/blob/main/README-fr_FR.md)',
              '[Indonesian](https://github.com/gibbok/typescript-book/blob/main/README-id_ID.md)': '[Tiếng Indonesia](https://github.com/gibbok/typescript-book/blob/main/README-id_ID.md)',
              '[Italian](https://github.com/gibbok/typescript-book/blob/main/README-it_IT.md)': '[Tiếng Ý](https://github.com/gibbok/typescript-book/blob/main/README-it_IT.md)',
              '[Japanese](https://github.com/gibbok/typescript-book/blob/main/README-ja_JP.md)': '[Tiếng Nhật](https://github.com/gibbok/typescript-book/blob/main/README-ja_JP.md)',
              '[Korean](https://github.com/gibbok/typescript-book/blob/main/README-ko_KR.md)': '[Tiếng Hàn](https://github.com/gibbok/typescript-book/blob/main/README-ko_KR.md)',
              '[Polish](https://github.com/gibbok/typescript-book/blob/main/README-pl_PL.md)': '[Tiếng Ba Lan](https://github.com/gibbok/typescript-book/blob/main/README-pl_PL.md)',
              '[Portuguese (Brazil)](https://github.com/gibbok/typescript-book/blob/main/README-pt_BR.md)': '[Tiếng Bồ Đào Nha (Brazil)](https://github.com/gibbok/typescript-book/blob/main/README-pt_BR.md)',
              '[Swedish](https://github.com/gibbok/typescript-book/blob/main/README-sv_SE.md)': '[Tiếng Thụy Điển](https://github.com/gibbok/typescript-book/blob/main/README-sv_SE.md)',
              '[Turkish](https://github.com/gibbok/typescript-book/blob/main/README-tr_TR.md)': '[Tiếng Thổ Nhĩ Kỳ](https://github.com/gibbok/typescript-book/blob/main/README-tr_TR.md)',
              '[Chinese](https://github.com/gibbok/typescript-book/blob/main/README-zh_CN.md)': '[Tiếng Trung](https://github.com/gibbok/typescript-book/blob/main/README-zh_CN.md)',
              '[Spanish](https://github.com/gibbok/typescript-book/blob/main/README_es_ES.md)': '[Tiếng Tây Ban Nha](https://github.com/gibbok/typescript-book/blob/main/README_es_ES.md)',
          }

          for before, after in replacements.items():
              if before in text:
                  text = text.replace(before, after, 1)

          expected_labels = [
              'Tiếng Bulgaria',
              'Tiếng Đức',
              'Tiếng Pháp',
              'Tiếng Indonesia',
              'Tiếng Ý',
              'Tiếng Nhật',
              'Tiếng Hàn',
              'Tiếng Ba Lan',
              'Tiếng Bồ Đào Nha (Brazil)',
              'Tiếng Thụy Điển',
              'Tiếng Thổ Nhĩ Kỳ',
              'Tiếng Việt',
              'Tiếng Trung',
              'Tiếng Tây Ban Nha',
          ]
          for label in expected_labels:
              if f'[{label}](' not in text:
                  raise SystemExit(f'Missing localized label: {label}')

          expected_targets = [
              'README-bg_BG.md',
              'README-de_DE.md',
              'README-fr_FR.md',
              'README-id_ID.md',
              'README-it_IT.md',
              'README-ja_JP.md',
              'README-ko_KR.md',
              'README-pl_PL.md',
              'README-pt_BR.md',
              'README-sv_SE.md',
              'README-tr_TR.md',
              'README-vi_VN.md',
              'README-zh_CN.md',
              'README_es_ES.md',
          ]
          for target in expected_targets:
              if target not in text:
                  raise SystemExit(f'Missing translation link target: {target}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate Markdown
        run: |
          cd tools
          npm ci
          npm run lint:md

      - name: Commit and push
        run: |
          rm .github/workflows/vi-readme-localize-translation-labels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README-vi_VN.md .github/workflows/vi-readme-localize-translation-labels.yml
          git commit -m 'Localize Vietnamese README translation labels'
          git push
