name: website-e2e

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, closed]

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    if: >-
      github.event.action == 'ready_for_review' ||
      (
        (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'synchronize') &&
        github.event.pull_request.draft == false
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build website
        run: npm run build
      - name: Run core end-to-end tests
        run: npm run e2e
      - name: Upload Playwright evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v6
        with:
          name: playwright-evidence-pr-${{ github.event.pull_request.number }}
          path: |
            website/playwright-report
            website/test-results
          if-no-files-found: error
          retention-days: 14
      - name: Add evidence to pull request
        if: always() && steps.evidence.outputs.artifact-url != ''
        uses: actions/github-script@v8
        env:
          ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
          TEST_STATUS: ${{ job.status }}
        with:
          script: |
            const marker = '<!-- website-e2e-evidence -->';
            const status = process.env.TEST_STATUS === 'success' ? '✅ Passed' : '❌ Failed';
            const body = `${marker}
            ## Website E2E report

            **Status:** ${status}

            [Download the Playwright HTML report, screenshots, and videos](${process.env.ARTIFACT_URL})

            This comment is updated when the pull request is marked ready for review and after each new push. The uploaded evidence is deleted when the pull request is merged.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const previous = comments.find(comment => comment.body?.includes(marker));

            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged pull request evidence
        uses: actions/github-script@v8
        with:
          script: |
            const artifactName = `playwright-evidence-pr-${context.issue.number}`;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            );

            for (const artifact of artifacts.filter(({ name }) => name === artifactName)) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
